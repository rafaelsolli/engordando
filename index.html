<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>engordando</title>
  <meta name="theme-color" content="#002B4D">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍫</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // aplica o tema escolhido antes de desenhar a página (evita piscar)
    try {
      const tema = localStorage.getItem('engordando:tema');
      if (tema === 'claro' || tema === 'escuro') document.documentElement.dataset.tema = tema;
    } catch { /* sem storage */ }
  </script>
</head>
<body>
  <header class="topo" id="topo">
    <button class="btn-conta" type="button"></button>
    <p class="topo-antes" id="topo-antes"></p>
    <div class="topo-riscado"><span id="topo-riscado"></span></div>
    <!-- na rolagem, as letras escorregam pra trás do "e" e o "e." vai pro canto -->
    <h1 id="titulo"><span class="marca" id="marca" aria-hidden="true"></span></h1>
  </header>

  <!-- só a lista rola; topo e rodapé ficam parados -->
  <div class="rolagem" id="rolagem">
  <main id="catalogo" class="catalogo">
    <p class="carregando">Carregando gostosuras…</p>
  </main>

  <!-- cashback do mês; sem login, convida pra entrar -->
  <div class="banner banner-cashback" id="banner-cashback" hidden>
    <div class="banner-emoji" id="cashback-emoji" aria-hidden="true"></div>
    <div class="banner-info">
      <h3 id="cashback-titulo"></h3>
      <div class="progresso-barra" id="cashback-barra"><span id="cashback-preenchido"></span></div>
      <p id="cashback-texto"></p>
    </div>
    <span class="banner-seta" id="cashback-seta" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
  </div>

  <a class="banner" id="banner" target="_blank" rel="noopener" hidden>
    <div class="banner-emoji" data-texto="banner.emoji"></div>
    <div class="banner-info">
      <h3 data-texto="banner.titulo"></h3>
      <p data-texto="banner.texto"></p>
    </div>
    <span class="banner-seta" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
  </a>
  </div>

  <!-- setinhas que avisam que tem mais lista pra cima/baixo -->
  <button class="seta seta-cima" id="seta-cima" type="button" aria-label="rolar pra cima" tabindex="-1">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <button class="seta seta-baixo" id="seta-baixo" type="button" aria-label="rolar pra baixo" tabindex="-1">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>

  <button class="btn-tema" id="btn-tema" type="button"></button>

  <footer class="barra" id="barra">
    <div class="barra-info">
      <span id="barra-itens"></span>
      <strong id="barra-total"></strong>
    </div>
    <button id="btn-pagar" class="btn btn-pagar" data-texto="barra.pagar" disabled></button>
  </footer>

  <div class="modal" id="modal-pix" hidden>
    <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="pix-titulo">
      <div id="doacao-etapa" hidden>
        <div class="doacao-emoji" id="doacao-emoji"></div>
        <h2 id="doacao-pergunta"></h2>
        <p class="dica" id="doacao-explicacao"></p>
        <div class="acoes">
          <button id="btn-doar" class="btn btn-link"></button>
          <button id="btn-nao-doar" class="btn btn-negar" data-texto="doacao.naoDoar"></button>
        </div>
        <label class="nao-perguntar">
          <input type="checkbox" id="doacao-nao-perguntar">
          <span data-texto="doacao.naoPerguntar"></span>
        </label>
      </div>
      <div id="pix-etapa" hidden>
        <h2 id="pix-titulo" data-texto="pix.titulo"></h2>
        <ul id="pix-resumo" class="resumo"></ul>
        <label class="nao-perguntar cupom-opcao" id="pix-cupom" hidden>
          <input type="checkbox" id="pix-cupom-usar">
          <span id="pix-cupom-texto"></span>
        </label>
        <p class="resumo-total"><span data-texto="pix.total"></span> <strong id="pix-total"></strong></p>
        <div id="pix-qr" class="qr"></div>
        <p class="dica" data-texto="pix.dica"></p>
        <div class="copia">
          <input id="pix-codigo" readonly aria-label="Pix copia e cola">
          <button id="btn-copiar" class="btn btn-sec"></button>
        </div>
        <div class="acoes">
          <button id="btn-voltar" class="btn btn-link" data-texto="pix.voltar"></button>
          <button id="btn-paguei" class="btn btn-pagar" data-texto="pix.paguei"></button>
        </div>
      </div>
      <div id="obrigado-etapa" hidden>
        <div class="obrigado-emoji" id="obrigado-emoji"></div>
        <h2 id="obrigado-titulo"></h2>
        <p id="obrigado-texto"></p>
        <button id="btn-fechar" class="btn btn-pagar"></button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-entrar" hidden>
    <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="entrar-titulo">
      <form id="form-entrar" novalidate>
        <h2 id="entrar-titulo" data-texto="conta.titulo"></h2>
        <p class="dica" data-texto="conta.dica"></p>
        <!-- digita só o usuário; o domínio fica fixo do lado -->
        <label class="campo campo-email">
          <input id="entrar-email" type="text" inputmode="email" autocomplete="username"
                 autocapitalize="none" spellcheck="false" aria-describedby="entrar-erro">
          <span class="sufixo" id="entrar-sufixo"></span>
        </label>
        <p class="erro-campo" id="entrar-erro" data-texto="conta.erro" hidden></p>
        <div class="acoes">
          <button type="button" id="btn-entrar-cancelar" class="btn btn-link" data-texto="conta.cancelar"></button>
          <button type="submit" class="btn btn-pagar" data-texto="conta.confirmar"></button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
